spring:
  application:
    name: smart-wallet

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

    web:
      pageable:
        max-page-size: 100

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

idempotency:
  processing-ttl: ${IDEMPOTENCY_PROCESSING_TTL:2m}
  completed-ttl: ${IDEMPOTENCY_COMPLETED_TTL:10m}